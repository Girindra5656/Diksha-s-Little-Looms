<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Crimson Bridal Banarasi">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B01B2E"/>
      <stop offset="1" stop-color="#B01B2E" stop-opacity="0.82"/>
    </linearGradient>
    <pattern id="buti" width="60" height="60" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#E4C989" stroke-width="1.4" opacity="0.5">
        <path d="M30 18 q10 12 0 24 q-10 -12 0 -24 Z"/>
        <circle cx="30" cy="30" r="2.2" fill="#E4C989" stroke="none"/>
      </g>
    </pattern>
  </defs>

  <rect width="600" height="800" fill="url(#g)"/>
  <rect width="600" height="800" fill="url(#buti)"/>

  <!-- borders -->
  <rect x="0" y="0" width="46" height="800" fill="#E4C989" opacity="0.9"/>
  <rect x="554" y="0" width="46" height="800" fill="#E4C989" opacity="0.9"/>
  <g stroke="#E4C989" stroke-width="2" opacity="0.85" fill="none">
    <rect x="58" y="16" width="484" height="768"/>
  </g>

  <!-- pallu band -->
  <rect x="58" y="616" width="484" height="168" fill="#E4C989" opacity="0.16"/>
  <g stroke="#E4C989" stroke-width="2" opacity="0.7" fill="none">
    <line x1="58" y1="616" x2="542" y2="616"/>
    <line x1="58" y1="700" x2="542" y2="700"/>
  </g>
  <g fill="#E4C989" opacity="0.85">
    <path d="M86 700 l14 26 l-28 0 Z"/><path d="M138 700 l14 26 l-28 0 Z"/><path d="M190 700 l14 26 l-28 0 Z"/><path d="M242 700 l14 26 l-28 0 Z"/><path d="M294 700 l14 26 l-28 0 Z"/><path d="M346 700 l14 26 l-28 0 Z"/><path d="M398 700 l14 26 l-28 0 Z"/><path d="M450 700 l14 26 l-28 0 Z"/><path d="M502 700 l14 26 l-28 0 Z"/>
  </g>

  <!-- monogram -->
  <g transform="translate(300,300)">
    <circle r="70" fill="none" stroke="#E4C989" stroke-width="2.5" opacity="0.9"/>
    <text x="0" y="20" text-anchor="middle" font-family="Georgia, serif" font-size="58" fill="#FBF6EF">DL</text>
  </g>

  <text x="300" y="410" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#FBF6EF">Crimson Bridal Banarasi</text>
  <text x="300" y="446" text-anchor="middle" font-family="Georgia, serif" font-size="16" letter-spacing="3" fill="#FBF6EF" opacity="0.8">WEDDING</text>
</svg>